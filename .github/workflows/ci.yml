name: CI

# Every pull request and every push to main: the checks that must be green before anything reaches production
# (handover 15). The browser tests on the real database need secrets, so they run in their own job and only on main.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  links:
    # Every page, link and button on the dummy-data app, as a visitor, a person and the admin
    runs-on: ubuntu-latest
    # About 30 minutes on a runner, so not on every pull request: after each merge to main, or by hand (Actions tab, Run workflow)
    if: github.event_name != 'pull_request'
    timeout-minutes: 75
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qc:links
        env:
          CI: "true"

  database:
    # Row-level security and the database rules, against the dev Supabase project (main only: it needs secrets)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    env:
      # Secrets cannot be tested in a step condition, so the job turns the question into a plain value first
      HAVE_DB_SECRETS: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
    steps:
      - name: Say when the database tests are skipped
        if: env.HAVE_DB_SECRETS != 'true'
        run: echo "::notice::Database tests skipped. Add the five secrets named below in GitHub (Settings, Secrets and variables, Actions) to run them on every merge to main."
      - uses: actions/checkout@v4
        if: env.HAVE_DB_SECRETS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAVE_DB_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAVE_DB_SECRETS == 'true'
      - run: npm run db:check && npm run test:db
        if: env.HAVE_DB_SECRETS == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
